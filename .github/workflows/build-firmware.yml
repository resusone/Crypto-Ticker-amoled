name: Build firmware

# Compiles the ticker firmware and attaches a ready-to-flash .bin to each release.
# Runs automatically when a release is published, or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17 and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "TFT_eSPI@2.5.43" "ArduinoJson@7.4.2" "WiFiManager@2.0.17"
          pip install esptool==4.5.1

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio" \
            --output-dir build crypto_ticker_amoled

      - name: Merge into a single .bin (flash at 0x0)
        run: |
          VERSION=$(grep -oP '#define FW_VERSION "\K[^"]+' crypto_ticker_amoled/crypto_ticker_amoled.ino)
          BOOTAPP0=$(ls ~/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin)
          BIN="CryptoTicker_v${VERSION}_merged.bin"
          esptool.py --chip esp32s3 merge_bin -o "$BIN" \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 build/crypto_ticker_amoled.ino.bootloader.bin \
            0x8000 build/crypto_ticker_amoled.ino.partitions.bin \
            0xe000 "$BOOTAPP0" \
            0x10000 build/crypto_ticker_amoled.ino.bin
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Keep the .bin as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ env.BIN }}

      - name: Attach the .bin to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$BIN" --clobber
